<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="forgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D5DFC" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark Background -->
  <rect width="100" height="100" rx="22" fill="#12121A"/>
  
  <!-- Digital Anvil / Forge Logo -->
  <g transform="translate(10, 12)">
    <!-- Sparks / Connection Nodes -->
    <circle cx="28" cy="8" r="3" fill="#22D3EE" />
    <circle cx="52" cy="6" r="2.5" fill="#6D5DFC" />
    <circle cx="70" cy="11" r="3" fill="#FF6B5B" />
    
    <!-- Connector Dashed Lines -->
    <path d="M30 18 L28 8 M50 18 L52 6 M62 18 L70 11" stroke="#DCDCE6" stroke-width="1.5" stroke-dasharray="2 2" stroke-linecap="round" opacity="0.5" />

    <!-- Top Horn/Anvil -->
    <path d="M20 35 C15 35 10 32 10 25 C10 18 20 18 25 18 L62 18 L68 25 L62 35 Z" fill="url(#forgeGrad)" filter="url(#glow)" />
    
    <!-- Mid Section -->
    <path d="M25 52 L55 52 L50 35 L30 35 Z" fill="url(#forgeGrad)" opacity="0.9" />
    
    <!-- Base -->
    <path d="M15 60 L65 60 L60 52 L20 52 Z" fill="url(#forgeGrad)" />
  </g>
</svg>
